[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isolated-italy"
version = "1.0.0"
description = "Access to essential services in Italy: open-data pipeline, road-routing checks and site planning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1",
  "numpy>=1.26",
  "pyarrow>=15",
  "scipy>=1.11",
  "rasterio>=1.3",
  "shapely>=2.0",
  "boto3>=1.35",
  "botocore[crt]>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "cfn-lint>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "infra/lambda"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "infra/lambda"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
